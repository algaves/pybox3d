          - Quat: reference/classes/quat.md
          - Box3D: reference/classes/box3d.md
          - Sphere: reference/classes/sphere.md
          - Capsule: reference/classes/capsule.md
          - ConvexHull: reference/classes/convexhull.md
          - Compound: reference/classes/compound.md
          - TriangleMesh: reference/classes/trianglemesh.md
