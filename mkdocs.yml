site_name: pybox3d
site_description: Python bindings (CPython C-API) for libbox3d, a 3D box geometry + rigid-body physics library
repo_url: https://github.com/algaves/pybox3d
theme:
  name: material
  icon:
    logo: material/cube
  favicon: images/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - NumPy interop: getting-started/numpy-interop.md
      - Documentation: getting-started/documentation.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Dropping a box: tutorials/falling-box.md
      - A swinging pendulum: tutorials/pendulum.md
      - A joint chain: tutorials/joint-chain.md
      - A drifting dumbbell: tutorials/dumbbell.md
      - A simple robot arm: tutorials/joint-types.md
      - A CharacterMover: tutorials/character-mover.md
      - Debug Draw: tutorials/debug-draw.md
  - Examples:
